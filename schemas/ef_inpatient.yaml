# 入院EF統合ファイル スキーマ定義
# 基準: 2025-05-30版 実施説明資料
# 単位: 月次・レセプト明細行単位

dataset: ef_inpatient
description: 入院患者の出来高算定情報（E/F統合後）
format: csv
delimiter: ","
encoding: shift_jis
record_unit: 明細行

fields:
  - name: facility_code
    position: 1
    type: string
    width: 10
    required: true
    pattern: "^\\d{10}$"
    source: facility.facility_code
    description: 医療機関コード

  - name: year_month
    position: 2
    type: string
    width: 6
    required: true
    pattern: "^\\d{6}$"
    source: claim_line.claim_month
    description: データ対象年月（YYYYMM）

  - name: patient_id
    position: 3
    type: string
    width: 20
    required: true
    source: patient.patient_id
    description: 統合番号（匿名化ID）

  - name: episode_id
    position: 4
    type: string
    width: 20
    required: true
    source: admission_episode.episode_id
    description: 入院エピソードID

  - name: record_type
    position: 5
    type: string
    width: 2
    required: true
    code_system: ef_record_type
    source: computed.record_type
    description: レコード種別（E=出来高, F=明細）

  - name: sequence_number
    position: 6
    type: integer
    width: 8
    required: true
    source: computed.sequence_number
    description: 連番

  - name: shinryo_code
    position: 7
    type: string
    width: 9
    required: true
    source: claim_line.shinryo_code
    description: 診療行為コード

  - name: shinryo_name
    position: 8
    type: string
    width: 200
    required: true
    source: claim_line.shinryo_name
    description: 診療行為名称

  - name: tensu
    position: 9
    type: integer
    width: 8
    required: true
    source: claim_line.tensu
    description: 点数

  - name: quantity
    position: 10
    type: integer
    width: 5
    required: true
    source: claim_line.quantity
    description: 回数

  - name: total_tensu
    position: 11
    type: integer
    width: 10
    required: true
    source: computed.total_tensu
    description: 合計点数（点数×回数）

  - name: claim_category
    position: 12
    type: string
    width: 2
    required: true
    code_system: claim_category
    source: claim_line.category
    description: 請求区分コード
